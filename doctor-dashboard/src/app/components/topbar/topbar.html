<div class="topbar">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Search patient name or ID" />
  </div>
  <div class="topbar-right">
    <a routerLink="/call" class="sim-btn">Simulate Incoming Call</a>
    <div class="notif">
      🔔
      <div class="notif-dot"></div>
    </div>
    <div class="avatar">{{ initials }}</div>
    <div class="doc-info">
      <div class="doc-name">{{ doctorName }}</div>
      <div class="doc-spec">{{ doctorDept }}</div>
    </div>
  </div>
</div>
