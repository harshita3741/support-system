<div class="settings-page">
  <div class="card">
    <div class="card-header">
      <div class="card-title">Account Settings</div>
    </div>
    <div class="form-body">
      <div class="form-group">
        <label>Display Name</label>
        <input [(ngModel)]="name" type="text" />
      </div>
      <div class="form-group">
        <label>Specialization</label>
        <input [(ngModel)]="specialization" type="text" />
      </div>
      <div class="form-group">
        <label>Notification Preferences</label>
        <div class="checkboxes">
          <label class="cb-label"><input type="checkbox" [(ngModel)]="caseAlerts" /> Incoming case alerts</label>
          <label class="cb-label"><input type="checkbox" [(ngModel)]="scheduleReminder" /> Daily schedule reminder</label>
          <label class="cb-label"><input type="checkbox" [(ngModel)]="emailSummaries" /> Email summaries</label>
        </div>
      </div>
      <button class="save-btn">Save Changes</button>
    </div>
  </div>
</div>
