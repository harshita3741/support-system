spring.application.name=supportsystem
# SQL Server connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=healthcare_support;encrypt=false
spring.datasource.username=appuser
spring.datasource.password=AppUser@123
spring.sql.init.mode=always


# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
# SQL Server dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Jackson — serialize LocalDateTime as ISO string, not array
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
