<div class="patients-page">
  <div class="page-head">
    <h2>Patients</h2>
    <p>Doctor-specific patient list</p>
  </div>

  <div class="patients-grid">
    @for (patient of patients; track patient.id) {
      <div class="patient-card" (click)="openPatient(patient.id)">
        <div class="patient-avatar">{{ patient.initials }}</div>
        <div class="patient-name">{{ patient.name }}</div>
        <div class="patient-sub">{{ patient.age }} yrs | {{ patient.gender }}</div>
        <div class="patient-sub">{{ patient.caseId }}</div>
        <div class="patient-sub">{{ patient.reason }}</div>
      </div>
    }
  </div>
</div>
