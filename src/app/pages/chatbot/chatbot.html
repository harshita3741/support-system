<div class="layout">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-dot">C</div>
      <span class="logo-text">CareAI</span>
    </div>
    <nav class="nav">
      <div class="nav-item" routerLink="/dashboard">Dashboard</div>
      <div class="nav-item" routerLink="/appointment">Appointments</div>
      <div class="nav-item" routerLink="/case-history">Case History</div>
      <div class="nav-item active">Chatbot</div>
      <div class="nav-item" routerLink="/profile">Profile</div>
    </nav>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-info">
        <div class="bot-avatar"></div>
        <div>
          <h3>CareAI Assistant</h3>
          <p>Online</p>
        </div>
      </div>
      <div class="avatar">HM</div>
    </div>
    <div class="chat-area" #chatArea>
      <ng-container *ngFor="let msg of messages">
        <div class="bubble-row" [class.user]="msg.sender === 'user'">
          <div class="bubble-avatar" [class.bot]="msg.sender === 'bot'" [class.user]="msg.sender === 'user'">
            <span *ngIf="msg.sender === 'bot'">AI</span>
            <span *ngIf="msg.sender === 'user'">H</span>
          </div>
          <div class="bubble" [class.bot]="msg.sender === 'bot'" [class.user]="msg.sender === 'user'">
            <span>{{ msg.text }}</span>
            <div class="case-badge" *ngIf="msg.caseBadge">{{ msg.caseBadge }}</div>
            <div class="queue-section" *ngIf="msg.inQueue">
              <div class="queue-info">
                <svg viewBox="0 0 24 24" fill="none" stroke="#534AB7" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                You are in queue — waiting for doctor
              </div>
              <div class="doctor-info" *ngIf="msg.doctorName">
                Doctor: {{ msg.doctorName }}
              </div>
              <button class="video-btn" *ngIf="msg.callReady">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="14" height="14"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                Join Video Call with {{ msg.doctorName }}
              </button>
            </div>
            <div class="time">{{ msg.time }}</div>
          </div>
        </div>
      </ng-container>
      <div class="bubble-row" *ngIf="isTyping">
        <div class="bubble-avatar bot">AI</div>
        <div class="typing">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
    <div class="suggestions">
      <div class="suggestion" *ngFor="let s of suggestions" (click)="sendSuggestion(s)">{{ s }}</div>
    </div>
    <div class="input-area">
      <input class="chat-input"
             [(ngModel)]="userInput"
             (keydown.enter)="send()"
             placeholder="Describe your symptoms..."
             [disabled]="isTyping"/>
      <button class="send-btn" (click)="send()" [disabled]="isTyping">Send</button>
    </div>
  </div>
</div>
