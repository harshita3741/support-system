<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-dot">C</div>
      <span class="logo-text">CareAI</span>
    </div>
    <nav class="nav">
      <div class="nav-item" routerLink="/dashboard">
        <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        Dashboard
      </div>
      <div class="nav-item" routerLink="/appointment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Appointments
      </div>
      <div class="nav-item" routerLink="/case-history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        Case History
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Chatbot
      </div>
      <div class="nav-item" routerLink="/profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Profile
      </div>
    </nav>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-info">
        <div class="bot-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="18" height="18">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div>
          <h3>CareAI Assistant</h3>
          <p>Online</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="avatar">HM</div>
      </div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-area" #chatArea>
      <div *ngFor="let msg of messages"
           class="bubble-row"
           [class.user]="msg.sender === 'user'">
        <div class="bubble-avatar"
             [class.bot]="msg.sender === 'bot'"
             [class.user]="msg.sender === 'user'">
          {{ msg.sender === 'bot' ? 'AI' : 'H' }}
        </div>
        <div class="bubble"
             [class.bot]="msg.sender === 'bot'"
             [class.user]="msg.sender === 'user'">
          {{ msg.text }}
          <div class="case-badge" *ngIf="msg.caseBadge">{{ msg.caseBadge }}</div>
          <div class="time">{{ msg.time }}</div>
        </div>
      </div>

      <!-- Typing indicator -->
      <div class="bubble-row" *ngIf="isTyping">
        <div class="bubble-avatar bot">AI</div>
        <div class="typing">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

    <!-- Suggestions -->
    <div class="suggestions">
      <div class="suggestion"
           *ngFor="let s of suggestions"
           (click)="sendSuggestion(s)">{{ s }}</div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <input class="chat-input"
             [(ngModel)]="userInput"
             (keyup)="onEnter($event)"
             placeholder="Describe your symptoms..."/>
      <button class="send-btn" (click)="send()">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="16" height="16">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div>
</div>
