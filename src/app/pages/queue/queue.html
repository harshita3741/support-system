<div class="queue-page">
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Live Queue — Cardiology</div>
        <div class="card-sub">Patients waiting for assignment</div>
      </div>
      <span class="waiting-badge">{{ queueItems.length }} waiting</span>
    </div>
    <table class="queue-table">
      <thead>
        <tr>
          <th>Patient</th>
          <th>Symptoms</th>
          <th>Priority</th>
          <th>Wait Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        @for (q of queueItems; track q.name) {
          <tr>
            <td>
              <div class="name-cell">
                <div class="avatar" [style.background]="q.bg" [style.color]="q.color">{{ q.initials }}</div>
                <div>
                  <div class="p-name">{{ q.name }}</div>
                  <div class="p-age">{{ q.age }} yrs · {{ q.gender }}</div>
                </div>
              </div>
            </td>
            <td class="muted">{{ q.symptoms }}</td>
            <td><span class="prio" [ngClass]="getPriorityClass(q.priority)">{{ q.priority }}</span></td>
            <td><span [ngClass]="getWaitClass(q.priority)">{{ q.wait }}</span></td>
            <td>
              <a routerLink="/call" class="accept-btn">Accept</a>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
