<div class="login-wrapper">
  <div class="login-box">
    <div class="logo">
      <div class="logo-dot">C</div>
      <span>CareNova</span>
    </div>

    <div class="tab-row">
      <div class="tab active">Sign In</div>
      <div class="tab" routerLink="/register">Create Account</div>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in with your Patient ID</p>

    <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

    <div class="form-group">
      <label>Patient ID</label>
      <input [(ngModel)]="patientId" placeholder="PAT-2026-000123"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter password"/>
    </div>
    <button class="btn-login" (click)="login()" [disabled]="loading">
      <span *ngIf="!loading">Sign In</span>
      <span *ngIf="loading">Signing in...</span>
    </button>

    <div class="register-link">
      New patient? <a routerLink="/register">Create your account</a>
    </div>
  </div>
</div>
