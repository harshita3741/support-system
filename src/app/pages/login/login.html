<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <div class="logo-dot">C</div>
      <span class="logo-text">CareNova</span>
    </div>

    <div class="tab-row">
      <div class="tab active">Sign In</div>
      <div class="tab" routerLink="/register">Create Account</div>
    </div>

    <h2>Welcome back</h2>
    <p>Sign in with your Patient ID</p>

    <div class="form-group">
      <label>Patient ID</label>
      <input [(ngModel)]="patientId" placeholder="PAT-2026-000123"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter password"/>
    </div>
    <button class="btn-login" (click)="login()">Sign In</button>

    <div class="signup-link">
      New patient? <a routerLink="/register">Create your account</a>
    </div>
  </div>
</div>
