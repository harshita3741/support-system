<div class="login-page">
  <div class="login-card">
    <div class="brand">MEDIQUEUE</div>
    <h1 class="login-title">Doctor Login</h1>
    <p class="login-sub">Sign in to access your patient dashboard</p>

    @if (errorMsg) {
      <div class="error-msg">{{ errorMsg }}</div>
    }

    <div class="form-group">
      <label>Username</label>
      <input
        type="text"
        [(ngModel)]="username"
        placeholder="e.g. dr.smith"
        (keyup.enter)="login()" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        (keyup.enter)="login()" />
    </div>

    <button class="login-btn" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign in' }}
    </button>

    <div class="demo-section">
      <div class="demo-label">Demo accounts (password: 1234)</div>
      <div class="demo-pills">
        @for (acc of demoAccounts; track acc.username) {
          <span class="demo-pill" (click)="fillDemo(acc)">
            {{ acc.label }}
          </span>
        }
      </div>
    </div>
  </div>
</div>
