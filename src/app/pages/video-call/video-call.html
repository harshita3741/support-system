<div class="call-container">
  <div class="call-header">
    <div class="logo">
      <div class="logo-dot">C</div>
      <span class="logo-text">CareAI</span>
    </div>
    <div class="call-status-bar" *ngIf="callStatus === 'connected'">
      <span class="pulse"></span>
      <span>{{ getCallTime() }}</span>
    </div>
  </div>

  <div class="call-ended" *ngIf="callStatus === 'ended'">
    <div class="ended-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="32" height="32"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 12 19 19.66 19.66 0 0 1 2.32 9.13 2 2 0 0 1 4.27 7h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 14.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
    </div>
    <h2>Call Ended</h2>
    <p>Your consultation with {{ doctorName }} has ended</p>
    <button routerLink="/dashboard" class="btn-home">Back to Dashboard</button>
  </div>

  <div class="video-area" *ngIf="callStatus !== 'ended'">
    <div class="doctor-video">
      <div class="connecting-overlay" *ngIf="callStatus === 'connecting'">
        <div class="spinner"></div>
        <p>Connecting to {{ doctorName }}...</p>
      </div>
      <div class="doctor-info-overlay" *ngIf="callStatus === 'connected'">
        <span class="doctor-name-tag">{{ doctorName }} — {{ department }}</span>
      </div>
      <div class="video-placeholder">
        <div class="doctor-avatar-big">{{ doctorName[3] }}{{ doctorName[4] }}</div>
      </div>
    </div>

    <div class="patient-video">
      <div class="patient-avatar-sm">{{ patientName[0]?.toUpperCase() }}</div>
      <span class="you-label">You</span>
    </div>
  </div>

  <div class="call-controls" *ngIf="callStatus !== 'ended'">
    <button class="ctrl-btn mute">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="20" height="20"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      Mute
    </button>
    <button class="ctrl-btn video-off">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="20" height="20"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      Video Off
    </button>
    <button class="ctrl-btn end-call" (click)="endCall()">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="20" height="20"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 12 19 19.66 19.66 0 0 1 2.32 9.13 2 2 0 0 1 4.27 7h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 14.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
      End Call
    </button>
  </div>
</div>
